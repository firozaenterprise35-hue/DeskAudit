# DeskAudit configuration — edit freely, all keys are optional.
# Paths support %USERPROFILE% and ~ expansion on Windows.

poll_interval_seconds: 5
idle_threshold_seconds: 300
db_path: "data/deskaudit.db"
log_path: "data/deskaudit.log"

watch_folders:
  - "%USERPROFILE%/Desktop"
  - "%USERPROFILE%/Documents"

# Skip noisy / temporary files. Matching is case-insensitive.
exclude_extensions:
  - ".tmp"
  - ".log"
  - ".lock"
  - ".part"
  - ".crdownload"

exclude_folders:
  - "data"
  - "reports"
  - ".venv"
  - "__pycache__"

# --- Browser tracking -------------------------------------------------
# History polling reads Chrome / Edge / Brave / Opera / Vivaldi History
# and Firefox places.sqlite (copied first, because the browser locks them).
# No extension is needed for this layer. Incognito history is never stored
# by the browser, so it is never tracked.
browser_enabled: true
browser_poll_seconds: 60
track_downloads: true
track_searches: true

# Exact active-tab URL, optional, pick ONE if you want it:
# 1) CDP: launch Chrome with --remote-debugging-port=9222, then set this to 9222.
browser_cdp_port: 0
# 2) Extension: install extension/chrome/ in Chrome/Edge, then set this true.
#    The extension POSTs the active tab to 127.0.0.1:8765 (localhost only).
browser_receiver_enabled: false
browser_receiver_port: 8765

# Your own overrides — these win over the built-in category list.
productive_domains:
  - "github.com"
distracting_domains:
  - "facebook.com"
  - "youtube.com"

# Never log these domains at all (e.g. banking, health).
exclude_domains: []

# --- Alerts -----------------------------------------------------------
# All thresholds are editable. Set enabled: false to turn alerts off.
alerts:
  enabled: true
  deletion_burst_count: 5        # 5 deletions within deletion_burst_minutes
  deletion_burst_minutes: 10
  deletion_folder_count: 3       # 3 deletions from one folder in a day
  night_start_hour: 0            # unknown app running 00:00-05:00
  night_end_hour: 5
  distracting_minutes: 60        # distracting browser time per day
  untagged_minutes: 60           # untagged time that also exceeds untagged_percent
  untagged_percent: 50
  idle_minutes: 120
  large_download_mb: 500
  notify: true                   # try a Windows notification for new alerts
  # new_app is quiet: only non-safe apps used at least this long today.
  new_app_min_minutes: 5
  known_safe_apps:
    - "chrome.exe"
    - "msedge.exe"
    - "firefox.exe"
    - "brave.exe"
    - "opera.exe"
    - "vivaldi.exe"
    - "code.exe"
    - "notepad.exe"
    - "explorer.exe"
    - "winword.exe"
    - "excel.exe"
    - "powerpnt.exe"
    - "outlook.exe"
    - "teams.exe"
    - "zoom.exe"
    - "slack.exe"
    - "discord.exe"

# --- Backups ----------------------------------------------------------
# backups/deskaudit-YYYY-MM-DD-HHMMSS.db — made with sqlite3 online backup.
# The agent makes one automatically each day on start (backup_on_start).
# Backups are git-ignored: they contain your private activity data.
backup_keep_days: 30
backup_keep_count: 30
backup_on_start: true

# --- Dashboard + secret gate ------------------------------------------
# The agent also serves the dashboard at http://127.0.0.1:8000/ while it
# runs, so the secret gate can open it any time (no separate --dashboard).
dashboard_on_start: true

# Dashboard lock (v12.6): the dashboard shows a plain white lock page
# until the owner types the secret-gate code above (1122) and presses
# Enter. The code is the same one — change it in secret_gate.code and
# both change together. Set false to open the dashboard without a code.
dashboard_lock: true

# Secret gate: click N times on the desktop, then type the code on the
# keyboard — the dashboard opens in the browser. Nothing is logged.
# Change the code from the dashboard Settings page, or here.
secret_gate:
  enabled: true
  clicks: 4
  code: "1122"
  click_window_seconds: 2   # the 4 clicks must happen within 2 seconds
  arm_seconds: 10           # then the code must be typed within 10 seconds

# --- Data Transfer Monitor (organisation) -------------------------------
# Watches for data LEAVING this PC: USB copies, cloud uploads, email /
# messaging channels, printing, copies out of sensitive folders, large
# moves. Metadata only — file name, size, destination, time, app. NEVER
# the content of what was typed or sent (no keystroke logging, no message
# or email text, no passwords, no clipboard). Per-PC: every staff PC runs
# its own agent and its own dashboard at http://127.0.0.1:8000/ .
transfers:
  enabled: true
  poll_seconds: 60        # how often the agent scans (USB / print / browser / files)
  sensitive_folders: []   # folders to guard, e.g.:
  #  - "%USERPROFILE%/Documents/CompanyData"
  #  - "D:/Accounts"
  cloud_min_seconds: 60         # a cloud session shorter than this is not logged
  communication_min_seconds: 60 # same for email / messaging channels
  cloud_alert_minutes: 15       # alert when cloud use passes this per day
  communication_alert_minutes: 30
  large_transfer_mb: 100        # a moved file at least this big alerts
  usb_alert: true
  print_alert: true
  sensitive_copy_alert: true

# --- Daily summary ----------------------------------------------------
# Local rule-based Bengali narrative, no AI API key, no internet.
# python main.py --ai-summary          (today)
# python main.py --ai-summary --weekly (7-day review)
# 9pm automatic job: double-click schedule_summary.bat (Windows Task Scheduler).

# --- Optional LLM summary ---------------------------------------------
# Local summary is ALWAYS the default. Only --ai-summary --llm uses this,
# and only aggregated stats are sent (no titles, paths or URLs).
# Provider "gemini" = Google AI Studio key (free tier, starts with AIza...).
# Get one at https://aistudio.google.com/app/apikey
# Give the key via DESKAUDIT_LLM_API_KEY env var (recommended) or in
# config.local.yaml (git-ignored). NEVER put the key in this file — it is
# tracked by git. Other providers: "openai" (gpt-4o-mini), "anthropic".
llm:
  enabled: false
  provider: "gemini"
  api_key: ""             # leave empty to use the env var instead
  model: "gemini-3.5-flash-lite"
  base_url: ""            # only for openai-compatible providers

# --- Telegram bot -----------------------------------------------------
# Outbound Bengali status/digests + critical-alert notices to ONE chat.
# Metadata only: app/window/file names and times — never typed text or
# message content. Setup: @BotFather -> /newbot (token), send /start to
# the bot, read chat.id from https://api.telegram.org/bot<TOKEN>/getUpdates
# (or @userinfobot). Put token + chat_id in config.local.yaml or in
# Dashboard Settings -> Telegram. NEVER put the token in this file.
# Commands the bot answers: /status (what is open now), /today, /help.
telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
  poll_seconds: 30        # how often the agent checks for /status etc.
  digest_minutes: 60      # scheduled digest cadence (minutes)
  notify_critical: true   # send critical alerts to Telegram immediately

# --- New-program watch ------------------------------------------------
# Whenever a program is opened AFTER the agent starts, Telegram gets an
# instant message: which program, its exe path, its open window title,
# when it opened, and its project tag. Metadata only — never what anyone
# types or writes inside the program. System/background processes never
# alert; the same program is not re-reported within cooldown_minutes.
app_watch:
  enabled: true
  notify_new_app: true
  cooldown_minutes: 10
  max_per_tick: 5

# Delete protection (v12.8): a deleted file looks deleted to the user,
# but its content is moved to a hidden quarantine folder instead of
# being lost. Telegram asks the owner per file: হ্যাঁ = delete for
# good, না = restore to the exact original place.
# - Normal Explorer deletes land in the Recycle Bin on every drive, so
#   they are quarantined from there (all files, all drives).
# - Shift+Delete skips the bin, so protected folders (Desktop,
#   Documents, sensitive folders, + protected_folders below) keep a
#   live mirror copy — a permanent delete there can still be undone.
# - A permanent delete OUTSIDE the protected folders can only be
#   logged, not undone (the content is gone before the agent sees it).
# - quarantine_path: "" = <install folder>/data/quarantine. Set it to
#   another (empty) drive, e.g. "E:/DeskAudit-Quarantine".
# - TEMP / %TEMP% files, browser caches and DeskAudit's own data are
#   never protected. Held files are never auto-purged — only the
#   owner's হ্যাঁ deletes them.
delete_protect:
  enabled: true
  quarantine_path: ""
  poll_seconds: 30
  mirror_max_mb: 500
  quarantine_max_gb: 10
  mirror_retention_days: 30
  protected_folders: []

# --- Telegram file explorer -------------------------------------------
# Browse drives and folders from Telegram (/explore) and copy / move /
# send / hide files — only the owner's chat may do it.
# - allowed_roots: [] = every drive is browsable. Set it to limit the
#   explorer, e.g. ["D:/", "E:/Accounts"].
# - hidden_path: "" = <install folder>/data/hidden. Hide MOVES the file
#   there (strong hide, like the v12.8 quarantine) — never just the
#   Windows "hidden" flag, which anyone can undo by showing hidden files.
# - max_send_mb: Telegram's Bot API sends at most ~50 MB per file;
#   bigger files can only be copied/moved to another drive.
# - Copy / move / hide are blocked inside system folders (Windows,
#   Program Files, ...) so a wrong tap can never break Windows.
explorer:
  enabled: true
  allowed_roots: []
  hidden_path: ""
  page_size: 20
  max_send_mb: 50

# --- Hourly email digest ----------------------------------------------
# One digest email every interval_minutes to your own address (SMTP).
# Gmail route: 2-Step Verification on, then an App Password for
# DeskAudit (Google Account -> Security -> App passwords). Put the
# address + 16-character app password in config.local.yaml or in
# Dashboard Settings -> Email. NEVER put the password in this file.
email:
  enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  from_addr: ""
  to_addr: ""
  interval_minutes: 60
  use_tls: true

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskAudit</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; height: 100%; }
</style>
</head>
<body>
<script>
// Anonymous unlock (v12.7): no field, no button, no text, no login —
// the page is just white. The owner opens the dashboard and types the
// code on the keyboard + Enter, and the dashboard appears at once.
// Digits older than 10s drop out; any other key (except Backspace)
// clears what was typed. A wrong code clears silently — the page
// simply stays white.
(function () {
  var buf = '';
  var last = 0;
  function reset() { buf = ''; last = 0; }
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    var now = Date.now();
    if (now - last > 10000) buf = '';
    if (e.key >= '0' && e.key <= '9') {
      buf = (buf + e.key).slice(-12);
      last = now;
      return;
    }
    if (e.key === 'Backspace') { buf = buf.slice(0, -1); last = now; return; }
    if (e.key === 'Enter') {
      var code = buf;
      reset();
      if (!code) return;
      fetch('/api/unlock', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({code: code})})
        .then(function (r) { return r.json(); })
        .then(function (data) { if (data && data.ok) location.reload(); })
        .catch(function () {});
      return;
    }
    reset();
  });
})();
</script>
</body>
</html>
